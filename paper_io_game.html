<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Territory.io</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
#ui { display: flex; gap: 20px; margin-bottom: 10px; color: #fff; font-size: 14px; }
.stat { background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 20px; }
.stat span { font-weight: 600; color: #f0e68c; }
#canvas { border: 2px solid rgba(255,255,255,0.2); border-radius: 4px; cursor: none; }
#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.75); color: #fff; }
#overlay h1 { font-size: 2.5rem; margin-bottom: 10px; letter-spacing: 2px; }
#overlay p { color: #aaa; margin-bottom: 24px; font-size: 15px; }
#overlay button { background: #f0e68c; color: #1a1a2e; border: none; padding: 12px 32px; border-radius: 30px; font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 1px; }
#overlay button:hover { background: #ffe066; }
#result { font-size: 1.5rem; margin-bottom: 8px; color: #f0e68c; }
</style>
</head>
<body>
<div id="ui">
  <div class="stat">Toi : <span id="myPct">0%</span></div>
  <div class="stat">🤖 Bot1 : <span id="b1Pct">0%</span></div>
  <div class="stat">🤖 Bot2 : <span id="b2Pct">0%</span></div>
  <div class="stat">⏱ <span id="timer">60</span>s</div>
</div>
<canvas id="canvas"></canvas>
<div id="overlay">
  <h1>Territory.io</h1>
  <p>Conquiers le maximum de territoire !<br>Utilise les touches ZQSD ou les flèches pour te déplacer.<br>Si un ennemi touche ta traînée → tu meurs !</p>
  <div id="result"></div>
  <button id="startBtn">Jouer</button>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CELL = 10, COLS = 60, ROWS = 50;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

const COLORS = {
  player: '#4FC3F7',
  bot1:   '#EF9A9A',
  bot2:   '#A5D6A7',
  empty:  '#16213e',
  grid:   '#1a2340'
};

let grid, players, timer, gameLoop, countdown, running;

function initGrid() {
  grid = Array.from({length: ROWS}, () => new Array(COLS).fill(null));
}

function claimRect(owner, x, y, w, h) {
  for (let r = y; r < y + h; r++)
    for (let c = x; c < x + w; c++)
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS)
        grid[r][c] = owner;
}

function initPlayers() {
  players = [
    { id: 'player', color: COLORS.player, x: 5, y: 5, dx: 1, dy: 0, trail: [], alive: true, territory: 0 },
    { id: 'bot1',   color: COLORS.bot1,   x: COLS-6, y: 5,    dx: -1, dy: 0, trail: [], alive: true, territory: 0 },
    { id: 'bot2',   color: COLORS.bot2,   x: COLS/2, y: ROWS-6, dx: 0, dy: -1, trail: [], alive: true, territory: 0 }
  ];
  claimRect('player', 2, 2, 6, 6);
  claimRect('bot1',   COLS-8, 2, 6, 6);
  claimRect('bot2',   COLS/2-3, ROWS-8, 6, 6);
}

function getOwnerColor(id) {
  const p = players.find(p => p.id === id);
  return p ? p.color : COLORS.empty;
}

function drawGrid() {
  ctx.fillStyle = COLORS.empty;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c]) {
        ctx.fillStyle = getOwnerColor(grid[r][c]);
        ctx.globalAlpha = 0.55;
        ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 0.3;
      ctx.strokeRect(c*CELL, r*CELL, CELL, CELL);
    }
  }
}

function drawPlayers() {
  for (const p of players) {
    if (!p.alive) continue;
    // trail
    for (const [tr, tc] of p.trail) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.8;
      ctx.fillRect(tc*CELL+1, tr*CELL+1, CELL-2, CELL-2);
      ctx.globalAlpha = 1;
    }
    // head
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.roundRect(p.x*CELL+1, p.y*CELL+1, CELL-2, CELL-2, 3);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function floodFill(owner, startR, startC, trailSet) {
  const visited = new Set();
  const queue = [[startR, startC]];
  const cells = [];
  let escaped = false;
  while (queue.length) {
    const [r, c] = queue.pop();
    const key = r + ',' + c;
    if (visited.has(key)) continue;
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) { escaped = true; continue; }
    visited.add(key);
    cells.push([r, c]);
    if (grid[r][c] === owner || trailSet.has(key)) continue;
    queue.push([r-1,c],[r+1,c],[r,c-1],[r,c+1]);
  }
  if (!escaped) cells.forEach(([r,c]) => grid[r][c] = owner);
}

function captureTerritory(p) {
  if (p.trail.length === 0) return;
  const trailSet = new Set(p.trail.map(([r,c]) => r+','+c));
  // fill all four corners' region
  const seeds = [[0,0],[0,COLS-1],[ROWS-1,0],[ROWS-1,COLS-1]];
  // flood from borders to find what's NOT enclosed
  const outside = new Set();
  const queue = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if ((r===0||r===ROWS-1||c===0||c===COLS-1) && grid[r][c] !== p.id && !trailSet.has(r+','+c))
      queue.push([r,c]);
  }
  while (queue.length) {
    const [r,c] = queue.pop();
    const key = r+','+c;
    if (outside.has(key) || r<0||r>=ROWS||c<0||c>=COLS) continue;
    if (grid[r][c] === p.id || trailSet.has(key)) continue;
    outside.add(key);
    queue.push([r-1,c],[r+1,c],[r,c-1],[r,c+1]);
  }
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!outside.has(r+','+c) && grid[r][c] !== p.id) grid[r][c] = p.id;
  }
  for (const [r,c] of p.trail) grid[r][c] = p.id;
  p.trail = [];
}

function countTerritory() {
  const counts = {};
  for (const p of players) counts[p.id] = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (counts[grid[r][c]] !== undefined) counts[grid[r][c]]++;
  const total = ROWS * COLS;
  for (const p of players) p.territory = Math.round(counts[p.id] / total * 100);
}

// Controls
let nextDx = 1, nextDy = 0;
document.addEventListener('keydown', e => {
  if (!running) return;
  const p = players[0];
  if ((e.key==='ArrowUp'||e.key==='z'||e.key==='Z') && p.dy !== 1)  { nextDx=0; nextDy=-1; }
  if ((e.key==='ArrowDown'||e.key==='s'||e.key==='S') && p.dy !== -1) { nextDx=0; nextDy=1; }
  if ((e.key==='ArrowLeft'||e.key==='q'||e.key==='Q') && p.dx !== 1)  { nextDx=-1; nextDy=0; }
  if ((e.key==='ArrowRight'||e.key==='d'||e.key==='D') && p.dx !== -1) { nextDx=1; nextDy=0; }
  e.preventDefault();
});

// Bot AI
function botMove(p) {
  if (!p.alive) return;
  const inBase = grid[p.y] && grid[p.y][p.x] === p.id && p.trail.length === 0;
  // pick direction toward unclaimed territory or back to base
  const dirs = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
  const valid = dirs.filter(d => {
    const nx = p.x + d.dx, ny = p.y + d.dy;
    if (nx<0||nx>=COLS||ny<0||ny>=ROWS) return false;
    if (d.dx===-p.dx && d.dy===-p.dy) return false;
    const isOwnTrail = p.trail.some(([r,c]) => r===ny && c===nx);
    return !isOwnTrail;
  });
  if (!valid.length) { p.dx = -p.dx; p.dy = -p.dy; return; }

  let chosen = null;
  if (p.trail.length > 12) {
    // go back to own territory
    const toBase = valid.filter(d => {
      const nx = p.x+d.dx, ny = p.y+d.dy;
      return grid[ny] && grid[ny][nx] === p.id;
    });
    if (toBase.length) chosen = toBase[Math.floor(Math.random()*toBase.length)];
  }
  if (!chosen) {
    // prefer empty or enemy territory
    const pref = valid.filter(d => {
      const nx = p.x+d.dx, ny = p.y+d.dy;
      return grid[ny] && grid[ny][nx] !== p.id;
    });
    chosen = pref.length ? pref[Math.floor(Math.random()*pref.length)] : valid[Math.floor(Math.random()*valid.length)];
    if (Math.random() < 0.75 && (p.dx===chosen.dx||p.dy===chosen.dy) && valid.find(d=>d.dx===p.dx&&d.dy===p.dy)) {
      chosen = valid.find(d=>d.dx===p.dx&&d.dy===p.dy);
    }
  }
  p.dx = chosen.dx; p.dy = chosen.dy;
}

function movePlayer(p, dx, dy) {
  if (!p.alive) return;
  const nx = p.x + dx, ny = p.y + dy;
  if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
    // bounce
    if (p.id !== 'player') { p.dx *= -1; p.dy *= -1; } return;
  }
  // check trail collision (self or others)
  for (const other of players) {
    if (!other.alive) continue;
    if (other.trail.some(([r,c]) => r===ny && c===nx)) {
      if (other.id === p.id) { p.alive = false; return; }
      else if (p.id !== 'player' || other.id !== 'player') {
        // hitting another's trail kills self
        p.alive = false; return;
      }
    }
  }
  // move
  p.trail.push([p.y, p.x]);
  p.x = nx; p.y = ny;
  // if back in own territory, capture
  if (grid[ny] && grid[ny][nx] === p.id && p.trail.length > 0) {
    captureTerritory(p);
  }
}

let tick = 0;
function update() {
  tick++;
  // move player
  const p = players[0];
  if (p.alive) {
    p.dx = nextDx; p.dy = nextDy;
    movePlayer(p, p.dx, p.dy);
  }
  // bots every 2 ticks (slower)
  if (tick % 2 === 0) {
    for (let i = 1; i < players.length; i++) {
      botMove(players[i]);
      movePlayer(players[i], players[i].dx, players[i].dy);
    }
  }
  countTerritory();
  drawGrid();
  drawPlayers();
  // UI
  document.getElementById('myPct').textContent = players[0].territory + '%';
  document.getElementById('b1Pct').textContent = players[1].territory + '%';
  document.getElementById('b2Pct').textContent = players[2].territory + '%';
  // check player dead
  if (!players[0].alive) endGame('💀 Tu es mort !');
}

let timeLeft;
function startCountdown() {
  timeLeft = 60;
  document.getElementById('timer').textContent = timeLeft;
  countdown = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    if (timeLeft <= 0) endGame('⏰ Temps écoulé !');
  }, 1000);
}

function endGame(reason) {
  running = false;
  clearInterval(gameLoop);
  clearInterval(countdown);
  countTerritory();
  const p = players[0];
  const won = p.territory > players[1].territory && p.territory > players[2].territory;
  const resultEl = document.getElementById('result');
  resultEl.textContent = reason + (won ? ' 🏆 Victoire !' : ' Défaite...');
  document.getElementById('startBtn').textContent = 'Rejouer';
  document.getElementById('overlay').style.display = 'flex';
}

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('result').textContent = '';
  clearInterval(gameLoop);
  clearInterval(countdown);
  initGrid();
  initPlayers();
  nextDx = 1; nextDy = 0;
  tick = 0;
  running = true;
  startCountdown();
  gameLoop = setInterval(update, 80);
});
</script>
</body>
</html>
